[project]
name = "dcctypes"
version = "0"
description = "Type hints for common DCC (3D-2D) applications."
readme = "README.md"
requires-python = ">=3.9" # Minimum version to run tests, used by uv run
dependencies = [
]

# --- Ruff --------------------------------------------------------------------

[tool.ruff]
# Assume Python 3.11
target-version = "py311"

line-length = 320
indent-width = 4

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "tests",
]

[tool.ruff.flake8-annotations]
suppress-none-returning = false
allow-star-arg-any = true
ignore-fully-untyped = true
mypy-init-return = true

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "D",        # Enforce docstyle
]

ignore = [
    "D102",     # Missing docstring in public method
    "D403",     # First letter of the first word in the docstring should be capitalized
    "D418",     # Overload should not contain a docstring
    "D105",     # Missing docstring in magic method
    "D107",     # Missing docstring in __init__
    "TD003"     # Missing issue link for this TODO
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"

[tool.ruff.lint.pydocstyle]
# I use an unholy mix of Googles docstring style, and my own mix that works the best in VSCode.
convention = "google"
ignore-var-parameters = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false

# --- Pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib", ]

# --- Black -------------------------------------------------------------------

[tool.black]
line-length = 320
target-version = ["py39"]
skip-magic-trailing-comma = false
skip-string-normalization = false

# --- Pyright -----------------------------------------------------------------

[tool.pyright]
typeCheckingMode = "basic"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"
reportOptionalIterable = "none"

# --- MyPy --------------------------------------------------------------------

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
warn_unused_configs = true
